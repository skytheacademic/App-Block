name: CI

# Every branch, not just main. The whole point is that a branch is known-good *before* it is merged —
# batch-b-robustness sat un-mergeable for a week because nothing ever built it from a clean clone.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Action majors are kept current deliberately, not opportunistically: GitHub retires the Node
      # runtime an old major is pinned to, and when it does these start failing on a day nothing in
      # the project changed. A green CI that goes red for a reason outside the repo is the worst kind
      # of red — so the bump happens while the run is passing, never as an emergency.
      #
      # Check the majors against the registry rather than incrementing by one and assuming: the first
      # pass here went v4->v5 across the board, and CI came back green while *still* warning that
      # upload-artifact and setup-gradle were on Node 20 — because those two were already at v7 and
      # v6. A green run does not mean the pins are current, only that they resolve.
      - uses: actions/checkout@v7

      # JDK 17, matching compileOptions/jvmTarget and the README's stated requirement. Robolectric
      # pins its SDK per-test for JDK-17 compatibility (see app/build.gradle.kts), so this is the
      # version the test suite is actually written against.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs cmdline-tools and accepts the SDK licences. It deliberately does NOT pin a platform:
      # AGP downloads whatever `compileSdk` asks for, so this one workflow serves branches on 35 and
      # 36 alike without needing an edit each time the project moves.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # testDebugUnitTest, not `test`: ui-test-manifest is a debugImplementation, so the Compose
      # screen tests can only resolve their host activity in the debug variant.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # always(), because a red run is exactly when the report is worth reading.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Sideloadable straight from the GitHub app on the phone — every green push leaves an install
      # candidate behind, so trying a change out never depends on having a laptop nearby. Debug only:
      # release signing needs the keystore, which is gitignored and stays off CI.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
